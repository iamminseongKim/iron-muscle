name: Build & Release Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. 안드로이드 APK 빌드
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Check exercise data and record preservation
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build PR check APK (not distributed)
        if: github.event_name == 'pull_request'
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Build consistently signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Set the permanent signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set keystore password}"
          : "${ANDROID_KEY_ALIAS:?Set key alias}"
          : "${ANDROID_KEY_PASSWORD:?Set key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/iron-muscle-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          export ANDROID_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          export ANDROID_VERSION_NAME="$(node -p 'require("./package.json").version')"
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/PR-check-only.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/IronMuscle-${{ steps.release_tag.outputs.tag }}.apk
          fi
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMuscle-Android-APK
          path: release-apk/*.apk
          retention-days: 30

  # 2. iOS 빌드 및 IPA 패키징 (클라우드 macOS)
  build-ios:
    name: Build iOS Project & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check exercise data and record preservation
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Compile iOS Project with Xcode CLI
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p release-ios/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app release-ios/Payload/
          cd release-ios
          zip -r IronMuscle-iOS.ipa Payload
          rm -rf Payload
          ls -lh

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMuscle-iOS-IPA
          path: release-ios/IronMuscle-iOS.ipa
          retention-days: 30

  # 3. 릴리즈 배포 (Android APK & iOS IPA 산출물 등록)
  release:
    name: Publish Release Packages
    permissions:
      contents: write
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: IronMuscle-Android-APK
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: IronMuscle-iOS-IPA
          path: release-assets

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate version-specific release notes
        run: node scripts/release-notes.mjs "${{ steps.release_tag.outputs.tag }}"

      - name: Publish GitHub Release (Android APK & iOS IPA)
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Iron Muscle Tracker ${{ steps.release_tag.outputs.tag }} (Android & iOS)"
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
