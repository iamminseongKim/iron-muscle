name: Build & Release Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. 안드로이드 APK 빌드
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Check exercise data and record preservation
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build PR check APK (not distributed)
        if: github.event_name == 'pull_request'
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Build consistently signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Set the permanent signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set keystore password}"
          : "${ANDROID_KEY_ALIAS:?Set key alias}"
          : "${ANDROID_KEY_PASSWORD:?Set key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/iron-muscle-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          export ANDROID_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          export ANDROID_VERSION_NAME="$(node -p 'require("./package.json").version')"
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/PR-check-only.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/IronMuscle-${{ steps.release_tag.outputs.tag }}.apk
          fi
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMuscle-Android-APK
          path: release-apk/*.apk
          retention-days: 30

  # 2. iOS 빌드 및 IPA 패키징 (클라우드 macOS)
  build-ios:
    name: Build iOS Project & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check exercise data and record preservation
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Compile iOS Project with Xcode CLI
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p release-ios/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app release-ios/Payload/
          cd release-ios
          zip -r IronMuscle-iOS.ipa Payload
          rm -rf Payload
          ls -lh

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMuscle-iOS-IPA
          path: release-ios/IronMuscle-iOS.ipa
          retention-days: 30

  # 3. 릴리즈 배포 (Android APK & iOS IPA 산출물 등록)
  release:
    name: Publish Release Packages
    permissions:
      contents: write
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: IronMuscle-Android-APK
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: IronMuscle-iOS-IPA
          path: release-assets

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release (Android APK & iOS IPA)
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Iron Muscle Tracker ${{ steps.release_tag.outputs.tag }} (Android & iOS)"
          body: |
            ## 🏋️‍♂️ Iron Muscle Tracker ${{ steps.release_tag.outputs.tag }} 로컬 설치용 배포판

            모든 데이터는 서버 없이 기기 내부(로컬)에만 안전하게 저장되는 독립형 앱입니다.

            ---

            ### 🍎 아이폰 & 아이패드 (iPhone / iPad) 로컬 설치

            #### 📥 [방법 1] iOS IPA 사이드로딩 (AltStore / Sideloadly)
            1. 아래 **Assets** 섹션의 **`IronMuscle-iOS.ipa`** 파일을 다운로드합니다.
            2. PC/Mac에서 **AltStore** 또는 **Sideloadly**를 실행하여 본인의 기기에 직접 설치합니다.

            #### 💻 [방법 2] Mac Xcode 실기기 빌드
            ```bash
            git clone https://github.com/iamminseongKim/iron-muscle.git
            cd iron-muscle && npm install && npm run build
            npx cap open ios
            ```
            Xcode에서 본인 개인 무료 계정(Signing)을 선택하고 연결된 iPhone/iPad로 빌드하여 설치합니다.

            ---

            ### 🤖 안드로이드 (Android) 스마트폰 설치

            1. 아래 **Assets** 섹션의 **`IronMuscle-${{ steps.release_tag.outputs.tag }}.apk`** 링크를 터치하여 다운로드합니다.
            2. 다운로드 완료 후 파일을 열고 **'출처를 알 수 없는 앱 설치 허용'**을 켠 뒤 설치합니다.

            ---

            ### 🌟 최신 업데이트 핵심 요약
            - **🌐 876개 전 종목 한국어 번역 완료**: 모든 운동 종목의 상세 설명, 수행 방법(Instructions), 코칭 팁(Tips) 100% 한국어화 (영어 원문 보존 및 다국어 지원 구조 완비)
            - **🏷️ 동작 중심 명칭 개편 & 브랜드 종속성 탈피**: 특정 머신 제조사 브랜드명에 얽매이지 않고 운동 역학과 동작 중심으로 명칭 통일 (기존 운동 ID 및 사용자 기록 완벽 보존)
            - **🦾 3D 인터랙티브 근육 해부도 연동**: Three.js 기반 인체 근육 3D 모델에서 타겟 부위(주동근/협응근)를 직관적으로 시각화 및 양방향 탐색
            - **📱 앱 하단 버전 & 크레딧 워터마크 표시**: 실시간 배포 버전 및 제작자 크레딧 정보 표기
            - **📥 AI 분석용 마크다운 일지(.md) 실제 기기 다운로드 지원**: Android SAF(Storage Access Framework) 및 네이티브 파일 저장 연동으로 모바일 환경에서 실제 .md 파일 다운로드 완벽 지원 (다운로드 시 불필요한 자동 복사 제거)
            - **🎯 오늘 운동 부위 다중 선택 & 루틴 추천**: 가슴, 등, 하체, 어깨, 팔, 복근 등 다중 타겟 부위 선택 및 맞춤형 루틴명 자동 생성
            - **🔥 운동 시작 라이프사이클 안전 분리**: 타이머와 세션 상태를 철저히 동기화하여 앱 백그라운드 전환 시에도 시간 및 기록 안전 보존
            - **✏️ 과거 운동 일지 완벽 수정/삭제**: 기록 조회 탭에서 과거 일지의 날짜, 제목, 종목별 세트 무게/횟수/RPE/휴식시간 실시간 편집 지원
            - **🔗 슈퍼세트/컴파운드세트 묶음 연동**: 시그니처 네온 브래킷으로 여러 종목 결합 수행 지원
            - **🔒 100% 오프라인 로컬 보안 보장**: 모든 운동 기록은 서버 전송 없이 사용자 기기 내부에만 완벽하게 보관 (JSON/MD 백업 및 복원 지원)
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
