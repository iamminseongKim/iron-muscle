name: Build & Release Mobile Apps (Android APK, iOS IPA & PWA)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. 안드로이드 APK 빌드
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v3.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/IronMuscle-${{ steps.release_tag.outputs.tag }}.apk
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMuscle-Android-APK
          path: release-apk/*.apk
          retention-days: 30

  # 2. iOS 빌드 및 IPA 패키징 (클라우드 macOS)
  build-ios:
    name: Build iOS Project & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Compile iOS Project with Xcode CLI
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p release-ios/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app release-ios/Payload/
          cd release-ios
          zip -r IronMuscle-iOS.ipa Payload
          rm -rf Payload
          ls -lh

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMuscle-iOS-IPA
          path: release-ios/IronMuscle-iOS.ipa
          retention-days: 30

  # 3. 배포 및 릴리즈 (Android APK + iOS IPA + GitHub Pages PWA)
  release-and-deploy:
    name: Release to GitHub & Deploy PWA
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to GitHub Pages (PWA for iPhone / iPad)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: IronMuscle-Android-APK
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: IronMuscle-iOS-IPA
          path: release-assets

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v3.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Clean Outdated Release Assets
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          echo "Checking for existing release assets under tag: $TAG"
          RELEASE_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE_DATA" | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Found existing release ID: $RELEASE_ID. Purging any old assets..."
            ASSET_IDS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r '.[].id // empty')
            for ASSET_ID in $ASSET_IDS; do
              echo "Deleting old asset $ASSET_ID"
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            done
          fi

      - name: Publish GitHub Release (Android APK & iOS IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Iron Muscle Tracker ${{ steps.release_tag.outputs.tag }} (Android & iOS)"
          body: |
            ## 🏋️‍♂️ Iron Muscle Tracker ${{ steps.release_tag.outputs.tag }} 배포판

            안드로이드(Android) 스마트폰 및 아이폰(iPhone), 아이패드(iPad)를 모두 지원하는 정식 릴리즈입니다.

            ---

            ### 🍎 아이폰 & 아이패드 (iPhone / iPad) 사용 안내

            #### ⚡ [방법 1] Safari 홈 화면에 추가 (가장 추천 - 무설치, 10초 완료!)
            1. iPhone 또는 iPad의 **Safari 브라우저**에서 웹 배포 링크 접속:
               👉 **[https://iamminseongKim.github.io/iron-muscle/](https://iamminseongKim.github.io/iron-muscle/)**
            2. 화면 하단 중앙의 **[공유 버튼 (네모에 위 화살표 􀈂)]** 터치
            3. 메뉴에서 **[홈 화면에 추가 (Add to Home Screen)]** 선택 후 [추가]
            4. 홈 화면에 생성된 **아이언 머슬 아이콘**을 누르면 브라우저 주소창 없이 **네이티브 앱과 100% 동일하게 전체화면(Full Screen)**으로 실행됩니다.
            *(오프라인 동작 및 모든 운동 기록은 기기 내부에 안전하게 보존됩니다)*

            #### 📥 [방법 2] iOS IPA 사이드로딩 (AltStore / Sideloadly / TrollStore)
            1. 아래 **Assets** 섹션의 **`IronMuscle-iOS.ipa`** 파일을 다운로드합니다.
            2. AltStore, Sideloadly 또는 TrollStore를 통해 본인의 무료 Apple ID로 아이폰/아이패드에 직접 네이티브 앱으로 설치합니다.

            ---

            ### 🤖 안드로이드 (Android) 스마트폰 설치 안내

            1. 아래 **Assets** 섹션의 **`IronMuscle-${{ steps.release_tag.outputs.tag }}.apk`** 링크를 터치하여 다운로드합니다.
            2. 다운로드 완료 후 파일을 열고 **'출처를 알 수 없는 앱 설치 허용'**을 켠 뒤 설치를 완료합니다.

            ---

            ### 🌟 최신 업데이트 핵심 요약
            - **🧹 초기 더미 데이터 제거**: 신규 사용자는 0개의 기록으로 깨끗하게 시작 (체험용 샘플 데이터 선택 가능)
            - **🎯 오늘의 운동 부위 다중 선택**: 가슴, 등, 하체, 어깨, 이두, 삼두, 복근 등 다중 선택 및 루틴명 자동 추천
            - **🔥 [운동 시작] 라이프사이클 분리**: 시작 버튼을 눌러야 타이머 가동, 세션 취소 및 완료 안전 분리
            - **🚀 스마트 부위 추천**: 첫 종목 추가 시 선택한 부위 탭이 기본 활성화되어 1초 만에 종목 등록
            - **✏️ 과거 기록 수정/삭제**: [기록 조회] 탭에서 이전 운동 일지의 날짜, 제목, 종목별 세트 무게/횟수/RPE/휴식시간 수정 및 삭제 완벽 지원
            - **🦾 편측성 & 부하방식 퀵 토글**: 원암(L/R) 및 플레이트/핀로드 원터치 토글
            - **🔗 슈퍼세트/컴파운드세트 결합**: 다중 종목 묶음 및 시그니처 네온 브래킷
            - **🤖 AI 마크다운 추출**: ChatGPT/Claude 코칭용 일지 테이블 원클릭 복사 & 파일 다운로드
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
